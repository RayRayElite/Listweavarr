<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in ? Listweavarr</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Segoe UI', sans-serif;
        background: #0d1119;
        color: #f3f6fc;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at top, #223b55, transparent 65%);
      }
      main {
        width: min(400px, calc(100vw - 72px));
        padding: 32px;
        background: #182130;
        border: 1px solid #344157;
        border-radius: 18px;
      }
      h1 {
        font-size: 32px;
        margin: 10px 0;
      }
      p {
        color: #adb9cc;
        line-height: 1.6;
      }
      .brand {
        color: #66e0df;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      label {
        display: block;
        margin-top: 26px;
      }
      input,
      button {
        box-sizing: border-box;
        width: 100%;
        padding: 14px;
        border-radius: 8px;
        font: inherit;
      }
      input {
        margin: 10px 0 16px;
        background: #101824;
        border: 1px solid #61728b;
        color: #fff;
      }
      button {
        background: #66e0df;
        color: #102e38;
        border: 0;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
      }
      details {
        font-size: 13px;
        margin-top: 24px;
      }
      #status {
        min-height: 24px;
      }
      input:focus-visible,
      button:focus-visible,
      summary:focus-visible {
        outline: 3px solid #66e0df;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="brand">LISTWEAVARR</span>
      <h1>Welcome back.</h1>
      <p>Sign in to your library workspace.</p>
      <form id="sign-in">
        <label for="password">Owner password</label
        ><input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          maxlength="1024"
          autofocus
        /><button id="submit" type="submit">Sign in</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
      <details>
        <summary>Forgot the password?</summary>
        <p>
          The installation owner can replace the password in the configured owner password file,
          then restart Listweavarr. This signs all devices out and preserves lists, integrations and
          library data.
        </p>
      </details>
    </main>
    <script src="/sign-in.js"></script>
  </body>
</html>
